# Dagster instance configuration shared by the webserver, daemon and code server.
storage:
  postgres:
    postgres_db:
      hostname:
        env: POSTGRES_HOST
      port: 5432
      db_name: dagster
      username:
        env: POSTGRES_USER
      password:
        env: POSTGRES_PASSWORD

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 4

run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher

scheduler:
  module: dagster.core.scheduler
  class: DagsterDaemonScheduler

telemetry:
  enabled: false
