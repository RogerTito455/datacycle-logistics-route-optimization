name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  lint-docs:
    name: Lint Markdown and YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"
      - name: yamllint
        run: pipx run yamllint -c .yamllint.yaml .

  python:
    name: Python lint and seed data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ruff
        run: uvx ruff@0.16.9 check . && uvx ruff@0.16.9 format --check .
      - name: Validate AI-generated seed data (structure and consistency)
        run: |
          uv run --project services/generator --frozen python services/generator/validate_company.py --offline
          uv run --project services/generator --frozen python services/generator/validate_seeds.py
      - name: Generator tests (offline)
        run: uv run --project services/generator --frozen pytest services/generator/tests
      - name: Planner and simulator tests (offline)
        run: uv run --project services/simulator --frozen pytest services/simulator/tests
      - name: Stream consumer tests (offline; the database tests run in the compose job)
        run: uv run --project services/consumer --frozen pytest services/consumer/tests

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A tiny extract keeps the OSRM build to seconds and spares Geofabrik a 258 MB download per run.
      OSRM_PBF_URL: https://download.geofabrik.de/europe/andorra-latest.osm.pbf
      SMOKE_ROUTE: 1.5218,42.5063;1.5390,42.5096
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i "s|^OSRM_PBF_URL=.*|OSRM_PBF_URL=${OSRM_PBF_URL}|" .env
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Start the platform
        run: docker compose up -d --build --wait --wait-timeout 900
      - name: Smoke test
        run: ./scripts/smoke-test.sh
      - uses: astral-sh/setup-uv@v6
      - name: Generator against the database
        # Loads the reference data twice, from the committed sample addresses so the job needs no open-data
        # portal, and generates a fixed past Monday twice, then checks bronze with SQL.
        run: ./scripts/generator-db-test.sh --sample 2026-09-28
      - name: Stream consumer against the database and the broker
        # Its tests with the database, then a fixed set of messages, a few valid and one malformed per
        # topic, through the running consumer, checked in bronze and ops.dead_letters, and a replay.
        run: ./scripts/consumer-stream-test.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop
        if: always()
        run: docker compose down -v
