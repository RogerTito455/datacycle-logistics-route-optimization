name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-docs:
    name: Lint Markdown and YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"
      - name: yamllint
        run: pipx run yamllint -c .yamllint.yaml .
